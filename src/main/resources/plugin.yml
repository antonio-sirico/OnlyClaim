name: OnlyClaim
main: me.siryq.onlyclaim.OnlyClaim
version: '1.3.0'
api-version: '1.21'
author: SiryQ
description: Plugin avanzato per la protezione dei territori con supporto sottoclaim, RTP, GUI e Teletrasporto.

commands:
  onlyclaim:
    description: Comando principale di OnlyClaim
    usage: /onlyclaim help
    aliases: [claim, oc]
    permission: onlyclaim.command.use

permissions:
  onlyclaim.command.use:
    description: Permette di usare il comando base /oc
    default: true
  onlyclaim.command.tool:
    description: Permette di ricevere lo strumento di claim
    default: true
  onlyclaim.command.rtp:
    description: Permette di usare il comando /oc rtp
    default: true
  onlyclaim.command.list:
    description: Permette di visualizzare la GUI dei claim
    default: true
  onlyclaim.tp.claim:
    description: Permette di teletrasportarsi ai territori principali
    default: true
  onlyclaim.tp.subclaim:
    description: Permette di teletrasportarsi ai sottoclaim
    default: true
  onlyclaim.rtp.bypass:
    description: Permette di ignorare il cooldown dell'RTP
    default: op
  onlyclaim.admin.reload:
    description: Permette di ricaricare la configurazione del plugin
    default: op
  onlyclaim.admin:
    description: Permesso per ignorare le protezioni e gestire i claim altrui
    default: op
  onlyclaim.group.default:
    description: Limiti per il gruppo base
    default: true
  onlyclaim.group.vip:
    description: Limiti per il gruppo VIP
    default: false
  onlyclaim.group.ultra:
    description: Limiti per il gruppo Ultra
    default: false